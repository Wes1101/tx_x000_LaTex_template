# Build the paper with latexmk. Pin the image tag (e.g. a TeX Live year) for reproducible builds.
image: registry.gitlab.com/islandoftex/images/texlive:latest

build:
  script:
    - cd paper
    - latexmk -quiet main.tex
  artifacts:
    when: always
    paths:
      - paper/build/main.pdf
      - paper/build/main.log

# On a tag, package the template as a zip without git history (see README, "Releases").
release:
  rules:
    - if: $CI_COMMIT_TAG
  image: alpine:latest
  before_script:
    - apk add --no-cache git zip
  script:
    - git archive --format=zip --prefix="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}/" -o "${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.zip" "${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - "${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.zip"
